<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PBF Impact Statements — Pilot Batch 01</title>
<style>
:root {
  --bg:#f4f3ef; --paper:#fff; --ink:#1c1c19; --muted:#6a6a62; --line:#e0dfd8;
  --accent:#2f5d50; --accent-soft:#e9f0ec; --warn:#8a4b12; --warn-soft:#fbefe1;
  --ctx:#E97132; --chal:#699331; --chg:#7030A0; --who:#C00000; --ev:#00B050;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%; }
h1,h2,h3,h4 { letter-spacing:-.01em; }
a { color:var(--accent); }

/* ---------- gate ---------- */
#gate { min-height:100vh; display:grid; place-items:center; padding:24px; }
.card { background:var(--paper); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow); padding:30px; max-width:440px; width:100%; }
.card h1 { font-size:20px; margin:0 0 6px; }
.card p { color:var(--muted); font-size:14px; margin:0 0 18px; }
.keyrow { display:flex; gap:8px; }
input[type=text], input[type=password], textarea, select {
  font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
  background:var(--paper); color:var(--ink); width:100%; }
#key { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.14em;
  text-transform:uppercase; }
textarea { min-height:90px; resize:vertical; line-height:1.5; }
button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink); padding:10px 16px; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
button.primary:disabled { opacity:.5; cursor:default; }
button:hover:not(:disabled) { filter:brightness(1.06); }
.err { color:var(--who); font-size:14px; margin-top:12px; min-height:20px; }

/* ---------- shell ---------- */
#app { display:none; }
header.bar { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92);
  backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--line); }
.bar-in { max-width:1180px; margin:0 auto; padding:10px 20px; display:flex; gap:14px;
  align-items:center; flex-wrap:wrap; }
.bar h1 { font-size:15px; margin:0; flex:1 1 auto; }
.bar h1 small { display:block; font-weight:400; color:var(--muted); font-size:12px; }
.save { font-size:12px; color:var(--muted); white-space:nowrap; }
.save.on { color:var(--accent); }
main { max-width:1180px; margin:0 auto; padding:0 20px 80px;
  display:grid; grid-template-columns:210px 1fr; gap:34px; align-items:start; }
nav.rail { position:sticky; top:64px; padding-top:26px; font-size:14px; }
nav.rail a { display:block; padding:5px 0; color:var(--muted); text-decoration:none;
  border-left:2px solid transparent; padding-left:10px; }
nav.rail a:hover { color:var(--ink); }
nav.rail a.on { color:var(--ink); border-left-color:var(--accent); font-weight:600; }
nav.rail .done { color:var(--accent); }
@media (max-width:860px) {
  main { grid-template-columns:1fr; gap:0; }
  nav.rail { display:none; }
}
section.blk { background:var(--paper); border:1px solid var(--line); border-radius:12px;
  padding:26px 30px; margin:26px 0; box-shadow:var(--shadow); scroll-margin-top:70px; }
section.blk > h2 { font-size:19px; margin:0 0 4px; }
.eyebrow { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
  font-weight:650; margin-bottom:10px; }

/* ---------- statement ---------- */
.stmt-head { font-size:21px; line-height:1.3; margin:14px 0 12px; }
.stmt-body { font-size:17px; line-height:1.72; }
.cards { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0 6px; }
.card { flex:1 1 150px; border:1px solid var(--line); border-radius:10px; padding:12px 14px;
  text-decoration:none; color:var(--ink); display:flex; flex-direction:column; gap:2px; }
.card:hover { border-color:var(--accent); }
.card .big { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
.card span:last-child { font-size:13px; color:var(--muted); }
.progress { margin-top:14px; }
.progress .bar { height:7px; border-radius:99px; background:var(--line); overflow:hidden; }
.progress .bar i { display:block; height:100%; background:var(--accent); transition:width .3s; }
.progress .note { display:block; margin-top:6px; }
.btnlink { display:inline-block; border:1px solid var(--line); border-radius:8px; padding:7px 13px;
  margin-right:8px; text-decoration:none; color:var(--ink); font-size:14px; }
.btnlink:hover { border-color:var(--accent); color:var(--accent); }
.rows { margin-top:12px; border-top:1px solid var(--line); }
.row { display:grid; grid-template-columns:118px 132px 1fr 130px 70px 18px; gap:10px; align-items:baseline;
  padding:10px 4px; border-bottom:1px solid var(--line); text-decoration:none; color:var(--ink); font-size:14px; }
.row:hover { background:var(--line); }
.row .rc { font-weight:600; }
.row .rid, .row .rp, .row .rf { color:var(--muted); font-size:13px; }
.row .rh { line-height:1.35; }
.row .rv { color:var(--accent); font-weight:700; text-align:right; }
.pager { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:16px; }
.pager .gap { color:var(--muted); padding:0 2px; }
.pager .chip[disabled] { opacity:.4; cursor:default; }
a.chip { text-decoration:none; }
.eyebrow a { color:var(--muted); text-decoration:none; }
.eyebrow a:hover { color:var(--accent); }
@media (max-width:760px) {
  .row { grid-template-columns:1fr auto; }
  .row .rid, .row .rp, .row .rf { display:none; }
}
.browse { margin-bottom:26px; }
.browse input.q { width:100%; padding:11px 13px; font:inherit; border:1px solid var(--line);
  border-radius:8px; background:var(--bg); color:var(--ink); }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.chip { border:1px solid var(--line); border-radius:999px; padding:3px 11px; font-size:13px;
  cursor:pointer; color:var(--muted); background:none; }
.chip:hover { color:var(--ink); }
.chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.chip .n { opacity:.65; margin-left:5px; font-variant-numeric:tabular-nums; }
.maprow { margin-top:16px; border:1px solid var(--line); border-radius:10px; padding:8px;
  background:var(--bg); }
svg.map { width:100%; height:auto; display:block; }
svg.map .other { fill:#e9e9ea; stroke:#fff; stroke-width:.3; }
svg.map .has  { fill:#bcd; stroke:#fff; stroke-width:.3; cursor:pointer; }
svg.map .has:hover { fill:var(--accent); }
svg.map .has.on { fill:var(--accent); }
svg.map .dot { fill:#bcd; stroke:#fff; stroke-width:.4; cursor:pointer; }
svg.map .dot.on, svg.map .dot:hover { fill:var(--accent); }
.counted { color:var(--muted); font-size:13px; margin-top:10px; }
.blk.hide { display:none; }
.colours .ctx  { color:var(--ctx); }
.colours .chal { color:var(--chal); }
.colours .chg  { color:var(--chg); }
.colours .who  { color:var(--who); }
.colours .ev   { color:var(--ev); }
.legend { display:flex; flex-wrap:wrap; gap:12px; font-size:12.5px; color:var(--muted);
  margin:14px 0 0; }
.legend span::before { content:"■ "; }
.legend .ctx::before{color:var(--ctx)} .legend .chal::before{color:var(--chal)}
.legend .chg::before{color:var(--chg)} .legend .who::before{color:var(--who)}
.legend .ev::before{color:var(--ev)}
.meta { font-size:13px; color:var(--muted); }
details { margin-top:16px; border-top:1px solid var(--line); padding-top:12px; }
summary { cursor:pointer; font-size:14px; color:var(--accent); font-weight:600; }
details[open] summary { margin-bottom:8px; }
.prose { font-size:14.5px; }
.prose table { border-collapse:collapse; width:100%; margin:10px 0; font-size:13px; }
.prose th, .prose td { border:1px solid var(--line); padding:6px 9px; text-align:left; vertical-align:top; }
.prose th { background:var(--accent-soft); color:var(--accent); }
.prose blockquote { margin:10px 0; padding:8px 14px; border-left:3px solid var(--line); color:var(--muted); }
.prose code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px;
  background:var(--accent-soft); padding:1px 5px; border-radius:4px; word-break:break-word; }
.prose h2 { font-size:18px; } .prose h3 { font-size:16px; }
.tw { overflow-x:auto; }

/* ---------- feedback ---------- */
.fb { margin-top:20px; border-top:2px solid var(--accent-soft); padding-top:16px; }
.fb-label { font-size:13px; font-weight:650; margin:14px 0 6px; display:block; }
.verdicts { display:flex; flex-wrap:wrap; gap:8px; }
.verdicts label { border:1px solid var(--line); border-radius:999px; padding:7px 14px;
  font-size:13.5px; cursor:pointer; background:var(--bg); }
.verdicts input { position:absolute; opacity:0; width:0; }
.verdicts label:has(input:checked) { background:var(--accent); border-color:var(--accent);
  color:#fff; font-weight:600; }
.q { border-top:1px solid var(--line); padding:16px 0 4px; }
.q:first-of-type { border-top:0; }
.q h3 { font-size:15px; margin:0 0 4px; }
.q .qtext { font-size:14px; color:var(--muted); margin:0 0 10px; }
.submitbar { position:sticky; bottom:0; background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px); border-top:1px solid var(--line); padding:12px 0; margin-top:8px;
  display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.note { font-size:13px; color:var(--muted); }
.ok { color:var(--accent); font-weight:600; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>PBF Impact Statements — Pilot Batch 01</h1>
    <p>Draft impact statements and stories for PBSO's Impact Hub. Enter the access key you were
       sent to open them. The documents are encrypted; the key is checked in your browser
       and never sent anywhere.</p>
    <form class="keyrow" id="gateform">
      <input type="text" id="key" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off"
             spellcheck="false" autofocus>
      <button class="primary" id="unlock" type="submit">Open</button>
    </form>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app">
  <header class="bar">
    <div class="bar-in">
      <h1>PBF Impact Statements — Pilot Batch 01
        <small id="builtline"></small></h1>
      <input type="text" id="reviewer" placeholder="Your name" style="width:150px" autocomplete="name">
      <span class="save" id="save">saved in this browser</span>
      
    </div>
  </header>
  <main>
    <nav class="rail" id="rail"></nav>
    <div id="content"></div>
  </main>
</div>

<script src="firebase-config.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => (s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const STORE = 'pbf-review-pilot-01';
let DATA = null, FEEDBACK = load(), colours = true;

function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; }
}
function save() {
  FEEDBACK.updatedAt = new Date().toISOString();
  localStorage.setItem(STORE, JSON.stringify(FEEDBACK));
  const el = $('#save');
  el.textContent = 'saved ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  el.classList.add('on');
  paintRail();
}

/* ---------------- unlock ---------------- */
$('#gateform').onsubmit = async e => {
  e.preventDefault();
  const raw = $('#key').value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
  if (!raw) return;
  $('#unlock').disabled = true;
  $('#err').textContent = 'Opening…';
  try {
    DATA = await decrypt(raw);
    sessionStorage.setItem(STORE + ':key', raw);
    start();
  } catch (err) {
    $('#err').textContent = 'That key did not open the documents. Check for a typo — ' +
      'the dashes do not matter.';
    $('#unlock').disabled = false;
  }
};

async function decrypt(pass) {
  const blob = await (await fetch('payload.enc.json', {cache:'no-store'})).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
    'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(blob.kdf.salt), iterations:blob.kdf.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(blob.iv)}, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ---------------- render ---------------- */
function segHTML(segments) {
  return segments.map(([tag, text]) =>
    tag ? `<span class="${tag}">${esc(text)}</span>` : esc(text)).join('');
}

const VERDICTS = ['Approve as drafted', 'Approve with edits', 'Needs rework', 'Cannot judge yet'];

let Q = '', FPROD = new Set(), FTAG = new Set(), FCTY = new Set(), ONLYNEW = false;
let SORT = 'order', PAGE = 1;
const PER = 20;

function projPath(rings) {
  return rings.map(r => 'M' + r.map(([lo, la]) => `${(lo+180).toFixed(1)},${(90-la).toFixed(1)}`)
    .join('L') + 'Z').join('');
}

function mapSVG() {
  const has = DATA.perCountry || {}, alias = DATA.atlasFor || {};
  const back = {};
  Object.entries(alias).forEach(([c, x]) => back[x] = c);
  const paths = DATA.world.map(f => {
    const c = back[f.n], d = projPath(f.p);
    return c ? `<path class="has" data-c="${esc(c)}" d="${d}"><title>${esc(c)} — ${has[c]} draft${has[c]>1?'s':''}</title></path>`
             : `<path class="other" d="${d}"/>`;
  }).join('');
  const dots = Object.entries(DATA.pointOnly || {}).map(([c, [lo, la]]) =>
    `<circle class="dot" data-c="${esc(c)}" cx="${(lo+180).toFixed(1)}" cy="${(90-la).toFixed(1)}" r="2.6">
       <title>${esc(c)} — ${has[c]} draft${has[c]>1?'s':''}</title></circle>`).join('');
  return `<svg class="map" viewBox="0 0 360 150" preserveAspectRatio="xMidYMid meet">${paths}${dots}</svg>`;
}

const reviewed = s => !!(FEEDBACK[s.key] && FEEDBACK[s.key].verdict);
const isDraft  = s => s.product !== 'Cross-border duplicate';

function matches(s) {
  if (FPROD.size && !FPROD.has(s.product)) return false;
  if (FCTY.size  && !FCTY.has(s.country)) return false;
  if (FTAG.size  && !(s.flagTags || []).some(t => FTAG.has(t))) return false;
  if (ONLYNEW && reviewed(s)) return false;
  if (!Q) return true;
  const hay = (s.country+' '+s.id+' '+s.heading+' '+s.bodyHtml+' '+s.product+' '+
               (s.flagTags||[]).join(' ')+' '+s.sources.join(' ')+' '+s.traceHtml).toLowerCase();
  return Q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}

function results() {
  const r = DATA.statements.filter(matches);
  if (SORT === 'flags')   r.sort((a,b) => (b.flagTags||[]).length - (a.flagTags||[]).length);
  if (SORT === 'country') r.sort((a,b) => a.country.localeCompare(b.country) || a.id.localeCompare(b.id));
  if (SORT === 'todo')    r.sort((a,b) => (reviewed(a)?1:0) - (reviewed(b)?1:0));
  return r;
}

/* ------------------------------------------------------------------ views */

function frontView() {
  const st = DATA.statements, done = st.filter(s => isDraft(s) && reviewed(s)).length;
  const tot = st.filter(isDraft).length;
  const prods = {}, tags = {};
  st.forEach(s => { prods[s.product] = (prods[s.product]||0)+1;
                    (s.flagTags||[]).forEach(t => tags[t] = (tags[t]||0)+1); });
  const card = (n, label, href) =>
    `<a class="card" href="${href}"><span class="big">${n}</span><span>${esc(label)}</span></a>`;
  const topTags = Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return `<section class="blk">
    <h2>PBF impact statements — review</h2>
    <div class="prose">${DATA.introHtml}</div>
    <div class="cards">
      ${Object.entries(prods).sort((a,b)=>b[1]-a[1])
        .map(([k,n]) => card(n, k, '#/list?prod=' + encodeURIComponent(k))).join('')}
    </div>
    <div class="progress"><div class="bar"><i style="width:${tot?Math.round(done/tot*100):0}%"></i></div>
      <span class="note">${done} of ${tot} drafts have a verdict${done<tot?` · ${tot-done} still to look at`:' · all done'}</span></div>
    <p style="margin-top:18px">
      <a class="btnlink" href="#/list">Browse all ${st.length}</a>
      <a class="btnlink" href="#/list?todo=1">Only what I haven't reviewed</a>
      <a class="btnlink" href="#/decisions">Decisions you need to take</a>
      ${DATA.docx ? '<button id="docx">Download the Word version</button>' : ''}
    </p>
  </section>
  <section class="blk">
    <h2>Where the work is</h2>
    <p class="note">Click a country to see its drafts.</p>
    <div class="maprow">${mapSVG()}</div>
  </section>
  <section class="blk">
    <h2>Straight to the parts needing judgement</h2>
    <p class="note">Flags are reviewer-facing notes, never published. These are the commonest.</p>
    <div class="chips">${topTags.map(([k,n]) =>
      `<a class="chip" href="#/list?tag=${encodeURIComponent(k)}">${esc(k)}<span class="n">${n}</span></a>`).join('')}</div>
  </section>`;
}

function controls() {
  const prods = {}, tags = {}, ctys = DATA.perCountry || {};
  DATA.statements.forEach(s => { prods[s.product]=(prods[s.product]||0)+1;
    (s.flagTags||[]).forEach(t => tags[t]=(tags[t]||0)+1); });
  const chip = (k,v,n,on) => `<button class="chip${on?' on':''}" data-k="${k}" data-v="${esc(v)}">${esc(v)}<span class="n">${n}</span></button>`;
  return `<input class="q" id="q" type="search" value="${esc(Q)}" autocomplete="off"
      placeholder="Search headings, text, countries, project IDs and flags">
    <div class="chips">${Object.entries(prods).sort((a,b)=>b[1]-a[1]).map(([k,n])=>chip('prod',k,n,FPROD.has(k))).join('')}</div>
    <div class="chips">${Object.entries(tags).sort((a,b)=>b[1]-a[1]).map(([k,n])=>chip('tag',k,n,FTAG.has(k))).join('')}</div>
    <div class="chips">${Object.entries(ctys).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,n])=>chip('cty',k,n,FCTY.has(k))).join('')}</div>
    <div class="chips" style="margin-top:12px">
      <button class="chip${ONLYNEW?' on':''}" data-k="todo" data-v="1">Not yet reviewed</button>
      <span class="note" style="margin-left:10px">Sort</span>
      ${['order','country','flags','todo'].map(k =>
        `<button class="chip${SORT===k?' on':''}" data-k="sort" data-v="${k}">${
          {order:'Elena\'s order',country:'Country',flags:'Most flags',todo:'Unreviewed first'}[k]}</button>`).join('')}
    </div>`;
}

function listView() {
  const r = results(), pages = Math.max(1, Math.ceil(r.length / PER));
  if (PAGE > pages) PAGE = pages;
  const slice = r.slice((PAGE-1)*PER, PAGE*PER);
  const rows = slice.map(s => `<a class="row" href="#/p/${s.key}">
      <span class="rc">${esc(s.country)}</span>
      <span class="rid">${esc(s.id)}</span>
      <span class="rh">${esc(s.heading || '—')}</span>
      <span class="rp">${esc(s.product)}</span>
      <span class="rf">${(s.flagTags||[]).length} flag${(s.flagTags||[]).length===1?'':'s'}</span>
      <span class="rv">${reviewed(s) ? '✓' : ''}</span></a>`).join('');
  const pager = pages > 1 ? `<div class="pager">
      <button class="chip" data-pg="${PAGE-1}" ${PAGE===1?'disabled':''}>Previous</button>
      ${Array.from({length:pages},(_,i)=>i+1)
        .filter(n => n===1 || n===pages || Math.abs(n-PAGE)<=2)
        .map((n,i,arr) => (i && n-arr[i-1]>1 ? '<span class="gap">…</span>' : '') +
          `<button class="chip${n===PAGE?' on':''}" data-pg="${n}">${n}</button>`).join('')}
      <button class="chip" data-pg="${PAGE+1}" ${PAGE===pages?'disabled':''}>Next</button>
    </div>` : '';
  return `<section class="blk browse">
    <h2>Find a draft</h2>
    ${controls()}
    <div class="maprow" style="margin-top:14px">${mapSVG()}</div>
    <div class="counted">${r.length === DATA.statements.length
      ? `All ${r.length} drafts` : `${r.length} of ${DATA.statements.length} drafts`}${
      pages>1 ? ` · page ${PAGE} of ${pages}` : ''}</div>
    <div class="rows">${rows || '<p class="note">Nothing matches. Clear a filter.</p>'}</div>
    ${pager}
  </section>`;
}

function projectView(key) {
  const r = results(), i = r.findIndex(s => s.key === key);
  const s = (i >= 0 ? r[i] : DATA.statements.find(x => x.key === key));
  if (!s) return `<section class="blk"><h2>Not found</h2>
    <p><a class="btnlink" href="#/list">Back to the list</a></p></section>`;
  const prev = i > 0 ? r[i-1] : null, next = (i >= 0 && i < r.length-1) ? r[i+1] : null;
  const fb = FEEDBACK[s.key] || {};
  return `<section class="blk">
    <div class="eyebrow"><a href="#/list">← all drafts</a>${i>=0 ? ` · ${i+1} of ${r.length}` : ''}</div>
    <h2>${esc(s.country)} <span class="note">${esc(s.id)}</span></h2>
    <div class="legend"><span style="color:var(--muted)">${esc(s.product)} · ${s.words} words</span></div>
    <div class="stmt-head">${esc(s.heading)}</div>
    <div class="stmt-body prose">${s.bodyHtml}</div>
    <div class="meta" style="margin-top:14px"><strong>Source:</strong> ${s.sources.map(esc).join('<br>')}</div>
    ${s.traceHtml ? `<details open><summary>Flags — caveats, source disagreements, and what needs your decision (not for publication)</summary>
      <div class="prose">${s.traceHtml}</div></details>` : ''}
    <div class="fb">
      <span class="fb-label">Your verdict</span>
      <div class="verdicts">${VERDICTS.map(v => `<label><input type="radio" name="v-${s.key}"
        value="${esc(v)}" ${fb.verdict===v?'checked':''}
        onchange="setField('${s.key}','verdict',this.value); paintProgress()">${esc(v)}</label>`).join('')}</div>
      <label class="fb-label" for="h-${s.key}">A better heading, if you have one</label>
      <input type="text" id="h-${s.key}" value="${esc(fb.heading||'')}"
        oninput="setField('${s.key}','heading',this.value)">
      <label class="fb-label" for="c-${s.key}">Comments</label>
      <textarea id="c-${s.key}" oninput="setField('${s.key}','comment',this.value)">${esc(fb.comment||'')}</textarea>
    </div>
    <div class="pager">
      ${prev ? `<a class="chip" href="#/p/${prev.key}">← ${esc(prev.country)} ${esc(prev.id.split(' ')[0])}</a>` : ''}
      ${next ? `<a class="chip" href="#/p/${next.key}">${esc(next.country)} ${esc(next.id.split(' ')[0])} →</a>` : ''}
    </div>
    <p class="note" style="margin-top:10px">Use ← and → to move between drafts.</p>
  </section>`;
}

function questionsBlock() {
  const fb = FEEDBACK.questions || {};
  return `<section class="blk" id="s-questions">
    <div class="eyebrow">Your answers unblock the next 128 projects</div>
    <h2>Ten open questions</h2>
    <p class="note">These came out of reading the guidance against the 993 source files.
      Answer what you can — anything you skip, I will assume and flag.</p>
    ${DATA.questions.map(q => `<div class="q">
      <h3>${q.n}. ${q.title}</h3>
      <p class="qtext">${q.html}</p>
      <textarea placeholder="Your answer" oninput="setQ('${q.n}',this.value)">${esc(fb[q.n]||'')}</textarea>
    </div>`).join('')}
  </section>`;
}

function submitBlock() {
  const live = window.FB && FB.apiKey && FB.projectId;
  return `<section class="blk" id="s-submit">
    <h2>Send it back</h2>
    <p class="note">${live
      ? 'This goes straight to the drafting team. Nothing is published anywhere public.'
      : 'Feedback delivery is not wired up yet — use Download, and email me the file.'}</p>
    <label class="fb-label" for="general">Anything else — on the format, the batch, or what to do next</label>
    <textarea id="general" oninput="FEEDBACK.general=this.value; save()">${esc(FEEDBACK.general||'')}</textarea>
    <div class="submitbar">
      ${live ? '<button class="primary" id="send">Submit feedback</button>' : ''}
      <button id="dl">Download a copy</button>
      <span class="note" id="sendmsg">Your answers save in this browser as you type.</span>
    </div>
  </section>`;
}

function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const params = new URLSearchParams(qs || '');
  if (params.has('prod')) { FPROD.clear(); FPROD.add(params.get('prod')); }
  if (params.has('tag'))  { FTAG.clear();  FTAG.add(params.get('tag')); }
  if (params.has('cty'))  { FCTY.clear();  FCTY.add(params.get('cty')); }
  if (params.has('todo')) ONLYNEW = true;
  if (params.toString()) PAGE = 1;
  const seg = path.split('/');
  if (seg[0] === 'p' && seg[1]) return {view: 'project', key: decodeURIComponent(seg[1])};
  if (seg[0] === 'list')      return {view: 'list'};
  if (seg[0] === 'decisions') return {view: 'decisions'};
  if (seg[0] === 'submit')    return {view: 'submit'};
  return {view: 'front'};
}

function render() {
  const r = route();
  const html =
    r.view === 'front'     ? frontView() :
    r.view === 'list'      ? listView() :
    r.view === 'project'   ? projectView(r.key) :
    r.view === 'decisions' ? questionsBlock() :
                             submitBlock();
  $('#content').innerHTML = html;
  window.scrollTo(0, 0);
  wire(r);
  paintRail(r.view);
  paintProgress();
}

function wire(r) {
  const q = $('#q');
  if (q) {
    q.oninput = e => { Q = e.target.value.trim(); PAGE = 1; redrawList(); };
    if (Q) { q.focus(); q.setSelectionRange(Q.length, Q.length); }
  }
  document.querySelectorAll('button.chip[data-k]').forEach(btn => btn.onclick = () => {
    const {k, v} = btn.dataset;
    if (k === 'sort') SORT = v;
    else if (k === 'todo') ONLYNEW = !ONLYNEW;
    else { const set = k === 'prod' ? FPROD : k === 'tag' ? FTAG : FCTY;
           set.has(v) ? set.delete(v) : set.add(v); }
    PAGE = 1; redrawList();
  });
  document.querySelectorAll('.pager button[data-pg]').forEach(btn => btn.onclick = () => {
    PAGE = +btn.dataset.pg; redrawList();
  });
  document.querySelectorAll('svg.map .has, svg.map .dot').forEach(el => el.onclick = () => {
    const c = el.dataset.c;
    if (r.view === 'front') { location.hash = '#/list?cty=' + encodeURIComponent(c); return; }
    FCTY.has(c) ? FCTY.delete(c) : FCTY.add(c);
    PAGE = 1; redrawList();
  });
  if ($('#docx')) $('#docx').onclick = () => dl(
    'data:application/vnd.openxmlformats-officedocument.wordprocessingml.document;base64,' + DATA.docx,
    'PBF impact statements.docx');
  if ($('#dl')) $('#dl').onclick = exportFile;
  if ($('#send')) $('#send').onclick = submit;
}

// Re-render the list in place. Changing a filter must not push a history entry --
// the back button should leave the list, not step through every chip clicked.
function redrawList() {
  if (route().view !== 'list') { location.hash = '#/list'; return; }
  $('#content').innerHTML = listView();
  wire({view: 'list'});
  paintProgress();
}

function paintProgress() {
  const tot = DATA.statements.filter(isDraft).length;
  const done = DATA.statements.filter(s => isDraft(s) && reviewed(s)).length;
  const el = $('#builtline');
  if (el) el.textContent = `${DATA.statements.length} drafts · ${done}/${tot} reviewed · built ${DATA.built}`;
  const bar = document.querySelector('.progress .bar i');
  if (bar) bar.style.width = (tot ? Math.round(done / tot * 100) : 0) + '%';
  document.querySelectorAll('.rows .row').forEach(a => {
    const k = a.getAttribute('href').split('/p/')[1];
    const s = DATA.statements.find(x => x.key === k);
    const v = a.querySelector('.rv');
    if (s && v) v.textContent = reviewed(s) ? '✓' : '';
  });
}

function paintRail(view) {
  const nav = [['#/', 'Front page'], ['#/list', 'All drafts'],
               ['#/decisions', 'Decisions needed'], ['#/submit', 'Send it back']];
  $('#rail').innerHTML = nav.map(([href, label]) =>
    `<a href="${href}" class="${(view==='front'&&href==='#/')||
       (view==='list'&&href==='#/list')||(view==='project'&&href==='#/list')||
       (view==='decisions'&&href==='#/decisions')||(view==='submit'&&href==='#/submit') ? 'on':''}">${esc(label)}</a>`).join('');
}

function start() {
  $('#gate').style.display = 'none';
  $('#app').style.display = 'block';
  $('#reviewer').value = FEEDBACK.reviewer || '';
  $('#reviewer').oninput = e => { FEEDBACK.reviewer = e.target.value; save(); };
  window.addEventListener('hashchange', render);
  // arrow keys step through drafts, which matters at 135; ignore them while typing
  window.addEventListener('keydown', e => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const m = location.hash.match(/^#\/p\/(.+)$/);
    if (!m) return;
    const r = results(), i = r.findIndex(s => s.key === decodeURIComponent(m[1]));
    const to = e.key === 'ArrowRight' ? r[i+1] : r[i-1];
    if (to) location.hash = '#/p/' + to.key;
  });
  render();
}

function setField(key, field, value) {
  FEEDBACK[key] = FEEDBACK[key] || {};
  FEEDBACK[key][field] = value;
  save();
}
function setQ(n, value) {
  FEEDBACK.questions = FEEDBACK.questions || {};
  FEEDBACK.questions[n] = value;
  save();
}

/* ---------------- delivery ---------------- */
function bundle() {
  return {
    batch: 'pilot-batch-01',
    reviewer: FEEDBACK.reviewer || '',
    submittedAt: new Date().toISOString(),
    statements: Object.fromEntries(DATA.statements.map(s => [s.key, FEEDBACK[s.key] || {}])),
    questions: FEEDBACK.questions || {},
    general: FEEDBACK.general || '',
  };
}
function dl(href, name) {
  const a = document.createElement('a');
  a.href = href; a.download = name; a.click();
}
function exportFile() {
  const name = (FEEDBACK.reviewer || 'review').replace(/[^\w]+/g, '-').toLowerCase();
  dl('data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(bundle(), null, 2)),
     `pbf-pilot-01-feedback-${name}.json`);
}

async function submit() {
  const btn = $('#send'), msg = $('#sendmsg');
  if (!FEEDBACK.reviewer) { msg.textContent = 'Add your name at the top first.'; return; }
  btn.disabled = true; msg.textContent = 'Sending…';
  try {
    const auth = await fetch(
      `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB.apiKey}`,
      {method:'POST', headers:{'Content-Type':'application/json'},
       body: JSON.stringify({returnSecureToken:true})});
    if (!auth.ok) throw new Error('auth ' + auth.status);
    const {idToken} = await auth.json();
    const body = {fields: {
      reviewer: {stringValue: FEEDBACK.reviewer},
      submittedAt: {timestampValue: new Date().toISOString()},
      payload: {stringValue: JSON.stringify(bundle())},
    }};
    const res = await fetch(
      `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents/${FB.collection||'feedback'}`,
      {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+idToken},
       body: JSON.stringify(body)});
    if (!res.ok) throw new Error('save ' + res.status + ' ' + (await res.text()).slice(0,120));
    msg.innerHTML = '<span class="ok">Sent — thank you.</span> You can keep editing and send again; ' +
      'each submission is kept separately.';
  } catch (e) {
    msg.innerHTML = 'Could not send (' + esc(e.message) + '). Use <b>Download a copy</b> and ' +
      'email me the file — nothing is lost.';
  }
  btn.disabled = false;
}

/* session resume: a refresh should not re-ask for the key */
(async () => {
  const k = sessionStorage.getItem(STORE + ':key');
  if (!k) return;
  try { DATA = await decrypt(k); start(); } catch { sessionStorage.removeItem(STORE + ':key'); }
})();
</script>
</body>
</html>
